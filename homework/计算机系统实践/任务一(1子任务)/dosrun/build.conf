[sdl]
output=surface
windowresolution=800x600

[dosbox]
memsize=16

[autoexec]
mount C D:\作业\计算机系统实践\任务一(1子任务)\dosrun\dosroot
C:
PATH C:\MASM;%PATH%
echo ==============================================
echo   MASM 6.11 - Assembling CALC.ASM...
echo ==============================================
MASM CALC.ASM;
echo.
echo ==============================================
echo   LINK - Linking CALC.OBJ...
echo ==============================================
LINK CALC.OBJ;
echo.
echo Build Complete!
exit
